name: release

# Publishes to PyPI using the org-level PYPI_API_TOKEN secret (owner-independent, so it keeps
# working after the repo moved into the Meshpilot-AGI org). Fires on a v* tag or manual dispatch.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  pypi-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist + wheel
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # Re-runs / partial uploads won't fail the job on already-present files.
          skip-existing: true
