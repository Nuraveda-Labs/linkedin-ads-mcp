[project]
name = "linkedin-ads-mcp"
version = "0.3.0"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
dependencies = [
    "httpx>=0.27",
    "mcp[cli]>=1.2.0",
    "fastmcp>=3.2.0",
]
description = "LinkedIn Ads MCP — MCP server for the LinkedIn Marketing API. Read + write campaigns, analytics, and creatives from any MCP client. Maintained by Nuraveda Lab."
readme = "README.md"
authors = [
    { name = "Nuraveda Lab", email = "help.nuraveda@gmail.com" },
]
keywords = ["LinkedIn", "LinkedIn Ads", "Marketing API", "MCP", "Model Context Protocol"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
homepage   = "https://github.com/Nuraveda-Labs/linkedin-ads-mcp"
repository = "https://github.com/Nuraveda-Labs/linkedin-ads-mcp.git"
issues     = "https://github.com/Nuraveda-Labs/linkedin-ads-mcp/issues"

[project.scripts]
linkedin-ads-mcp = "linkedin_ads_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["linkedin_ads_mcp"]
